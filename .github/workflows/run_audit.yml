name: Hidro Ecuador Auto-Audit GIS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Copiar repositorio en el servidor de GitHub
        uses: actions/checkout@v3

      - name: Instalar dependencias del sistema operativo (GIS / GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev python3-gdal

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar motor de auditoría GIS e hidrológica
        run: python main.py

      - name: Guardar los reportes actualizados en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_report.json ecuador_hydro_audit.csv
          git commit -m "Actualización automática de auditoría GIS e hidroeléctrica [skip ci]" || echo "No hay cambios nuevos"
          git push