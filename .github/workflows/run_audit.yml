name: Hidro Ecuador Auto-Audit

on:
  # Permite ejecutarlo manualmente haciendo clic en un botón en GitHub
  workflow_dispatch:
  
  # Opcional: Programarlo para que corra automáticamente todos los días a las 6:00 AM
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Necesario para que el script pueda guardar el audit_report.json actualizado en el repo

    steps:
      - name: Copiar repositorio en el servidor de GitHub
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar motor de auditoría hidroeléctrica
        run: python main.py

      - name: Guardar el reporte actualizado en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_report.json
          git commit -m "Actualización automática de auditoría hidroeléctrica [skip ci]" || echo "No hay cambios nuevos"
          git push